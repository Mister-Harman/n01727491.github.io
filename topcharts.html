<!DOCTYPE html>
<html>
    <head>
        <title>La musique</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel = "stylesheet" href = "styles/style_otherpages.css">
        <style>
            /* to style the pop-up menu */
            #shortcut-menu {
                position: fixed;
                z-index: 1000;
                width: 200px;
                background: white;
                border: 1px solid #ccc;

                border-radius: 3px;
                display: none;
            }
            
            #shortcut-menu ul {
                list-style: none;
                margin: 0;
                padding: 2%;
            }
            
            #shortcut-menu ul li {
                padding: 10px 15px;
                cursor: pointer;
                border-bottom: 1px solid #eee;
            }
            
            #shortcut-menu ul li:last-child {
                border-bottom: none;
            }
            
            #shortcut-menu ul li:hover {
                background-color: #f79c90;
            }
        </style>
    </head>
    <body>
        <header>
            <!-- to make the haeder naviagtion -->
            <nav>
                <ul>
                    <li id = "home" class = "navigation"><a class = "link" href="index.html">Home</a></li>
                    <li id = "topchart" class = "navigation"><a class = "link active" href="topcharts.html">Top Charts</a></li>
                    <li id = "music" class = "navigation"><a class = "link" href="music.html">Music</a></li>
                    <li id = "artist" class = "navigation"><a class = "link" href="artist.html">Artists</a></li>
                    <li id = "search" class = "navigation"><a class = "link" href = "search.html">Search</a>
                    <li id="search" class="navigation"><a class="link" href="favourite.html">Favourite List</a></li>
                    <li id = "aboutus" class = "navigation"><a class = "link" href="aboutus.html">Contact us</a></li>
                </ul>
            </nav>
            <a href="index.html"><img id="logo" src="img/logo.webp"></a>
            <h1>La Musique</h1>
        </header>
        <main>
            <h2>Top 10 Songs</h2>
            <!-- to make the filter with which we can see top songs of different regions -->
            <div>
                <label for="region" id="region">Select Region:</label>
                <select id="filter" class="region-select" onchange="fetchTopSongs()">
                    <option value="us">United States</option>
                    <option value="gb">United Kingdom</option>
                    <option value="ca">Canada</option>
                    <option value="au">Australia</option>
                    <option value="de">Germany</option>
                    <option value="fr">France</option>
                    <option value="jp">Japan</option>
                    <option value="in">India</option>
                </select>
            </div>
            <!-- the place where the chart actually would be shown -->
            <div class="chart" id="chart"></div>
        </main>
        <!-- to make the pop-up menu -->
        <div id="shortcut-menu">
            <ul>
                <li id="option1">Home</li>
                <li id="option2">Music</li>
                <li id="option3">Artists</li>
                <li id="option4">Accessibility</li>
            </ul>
        </div>
        <footer>
            <p id = "cprt">copyright @ THE 3</p> 
            <a href = "creditsandreferences.html">credits and references</a>
        </footer>
        <script src="javascript/charts.js"></script>
        <script>
            // JavaScript for the pop-up menu
            document.addEventListener('DOMContentLoaded', function() {
                const customMenu = document.getElementById('shortcut-menu');
                
                // Track if Alt key is pressed
                let isAltPressed = false;
                
                // Listen for Alt key press and release
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Alt') {
                        isAltPressed = true;
                    }
                });
                
                document.addEventListener('keyup', function(e) {
                    if (e.key === 'Alt') {
                        isAltPressed = false;
                    }
                });
                
                // Custom context menu on Alt + right-click
                document.addEventListener('contextmenu', function(e) {
                    if (isAltPressed) {
                        e.preventDefault(); // Prevent the default context menu
                        
                        // Position the custom menu at the mouse position
                        
                        customMenu.style.zIndex = 1000;
                        customMenu.style.display = 'block';
                        customMenu.style.left = e.clientX  + 'px';
                        customMenu.style.top = e.clientY  + 'px';
                         
                    }
                });
                
                // Hide menu when clicking elsewhere
                document.addEventListener('click', function() {
                    customMenu.style.display = 'none';
                });
                
                // Handle menu item clicks
                document.getElementById('option1').addEventListener('click', function() {
                    window.location.href = 'index.html';
                    customMenu.style.display = 'none';
                });
                
                document.getElementById('option2').addEventListener('click', function() {
                    window.location.href = 'music.html';
                    customMenu.style.display = 'none';
                });
                
                document.getElementById('option3').addEventListener('click', function() {
                    window.location.href = 'artist.html';
                    customMenu.style.display = 'none';
                });
                
                document.getElementById('option4').addEventListener('click', function() {
                    document.body.classList.toggle('light-readable-mode');
                    customMenu.style.display = 'none';
                });
            });
        </script>
    </body>
</html>
